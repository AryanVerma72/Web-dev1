<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadow and Outline</title>
    <style>
        .box{
            border: 2px solid red;
            padding: 34px;
            box-shadow: 5px 15px 5px blue;
            text-shadow: 5px 15px 5px red;
            height: 20vh;
        }
        .text-shadow{
            text-shadow: 2px 10px 2px red;
            border: 2px solid black;
            border-radius: 23px;
            outline: 2px solid red;
            outline-offset: 22px;


        }
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>
    <p class="text-shadow">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Cum facere veritatis, assumenda repellat voluptate obcaecati illo, neque facilis debitis optio cumque nam possimus aliquid doloremque? Reprehenderit explicabo alias facilis, nulla iure excepturi dolore sequi.
    </p>
</body>
</html>
