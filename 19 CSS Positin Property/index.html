<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            height: 444px;
            width:80vw;
            border: 2px solid black;
            padding: 3px;
            margin: 3px;
        }
        .box1{
            background-color: red;
            position: sticky;
            height: 20px;
            width: 100%;
            top: 0px;
            /* position: absolute;     
            top: 0px;
            left: 2px; */
            
        }
        .box2{background-color: blue;
            /* position: relative; */
            /* top: 45px;
            left: 34px; */


        }
        .box3{
            background-color: brown;
            position: fixed;
            bottom: 0px;
            height: 10px;
        }
        .box4{
            background-color: cadetblue;
        }
        
        .parent{
            border: 2px solid red;
            margin: 34px;
            padding: 44px;
            /* position: absolute; */

        }
    </style>
</head>
<body>
    <div class="parent">

        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>
</html>
