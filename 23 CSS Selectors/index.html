<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More on  Css Selectors</title>
    <style>
        .box:first-child{
            background-color: violet;
        }
        .boxes::before{
            content: "I am good";
        }
        .boxes::after{
            content: "What Happend";
        }
        ::selection{
            background-color: black;
            color: yellow;
        }
    </style>
</head>
<body>
    <div class="boxes">
        <div class="box">Hey I am a box</div>
        <div class="box">Hey I am a box</div>
        <div class="box">Hey I am a box</div>
    </div>
</body>
</html>
