<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event bubbling</title>
</head>
<style>
    .child {
        background-color: blueviolet;
        border: 2px solid black;
        padding: 34px;
        margin: 24px;
        cursor: pointer;
    }

    .childContainer {
        background-color: rgb(226, 189, 43);
        padding: 14px;
        margin: 14px;
        border: 2px solid black;

    }

    .container {
        background-color: rgb(43, 76, 226);
        padding: 14px;
        margin: 14px;
        border: 2px solid black;

    }
</style>

<body>
    <div class="container">
        <section class="childContainer">
            <div class="child">
                I am a Child
            </div>
        </section>
    </div>
    <script>

        document.querySelector(".child").addEventListener("click", (e) => {
            e.stopPropagation()
            alert("The Child was clicked")
        })

        document.querySelector(".childContainer").addEventListener("click", (e) => {
            alert("ChildContainer was clicked")
        })

        document.querySelector(".container").addEventListener("click", (e) => {
            alert("Container was clicked")
        })


        function getRandomColor() {
            let val1 = Math.ceil(0 + Math.random() * 255)
            let val2 = Math.ceil(0 + Math.random() * 255)
            let val3 = Math.ceil(0 + Math.random() * 255)
            return `rgb(${val1}, ${val2}, ${val3})`
        }

        setInterval(() => {
            document.querySelector(".container").style.background = getRandomColor()
        }, 100);
        setTimeout(() => {
            document.querySelector(".childContainer").style.background = getRandomColor()
        }, 1000);


    </script>
</body>

</html>
