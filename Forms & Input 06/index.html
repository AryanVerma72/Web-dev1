<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <h1>Form to apply teaching assistence</h1>
    <form action="post">
      <div>
        <label for="Username">Enter your Username</label>
        <input
          type="text"
          id="Username"
          name="Username"
          placeholder="Enter your username"
          autofocus
        />
      </div>
      <div>
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female">Female</label>
      </div>
      <div>
        <input type="checkbox" id="code" name="Code" value="yes" />
        <label for="code">This is my code</label>
      </div>
      <div>
        <input type="date" name="" id="" />
      </div>

      <div>
        <textarea name="comment" rows="4" cols="50" autofocus>
Enter your comment here... </textarea
        >
      </div>
      <div>
        <select name="fruits">
          <option value="apple">Apple</option>
          <option value="banana">Banana</option>
          <option value="cherry">Cherry</option>
        </select>
      </div>
    </form>

    <h1>Enter Your details</h1>
    <form action="post">
      <div>
        <label for="Name">Enter your Name</label>
        <input
          type="text"
          id="Name"
          name="Name"
          placeholder="Enter Your name"
        />
      </div>
      <div>
        <label for="City">Enter Your City</label>
        <input
          type="text"
          name="city"
          id="city"
          placeholder="Enter Your City"
        />
      </div>
      <div>
        <label for="pincode">Enter Your Pincode</label>
        <input
          type="number"
          name="pincode"
          id="pincode"
          placeholder="Enter your pincode"
        />
      </div>
    </form>
  </body>
</html>
